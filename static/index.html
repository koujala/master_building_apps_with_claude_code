<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkBoard</title>
  <meta name="theme-color" content="#662d91">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/main.js"></script>
</head>
<body>
  <header>
    <h1>WorkBoard</h1>
    <form id="add-form">
      <input id="add-title" name="title" placeholder="Add a task…" maxlength="200" required autocomplete="off">
      <button type="submit">Add task</button>
    </form>
    <button id="chat-toggle" type="button" aria-expanded="false" aria-controls="chat">Ask AI</button>
  </header>
  <main id="board">
    <section class="column" data-status="planned"><h2>Planned <span class="count">0</span></h2><ul></ul></section>
    <section class="column" data-status="in_progress"><h2>In-Progress <span class="count">0</span></h2><ul></ul></section>
    <section class="column" data-status="testing"><h2>Testing <span class="count">0</span></h2><ul></ul></section>
    <section class="column" data-status="completed"><h2>Completed <span class="count">0</span></h2><ul></ul></section>
  </main>
  <aside id="chat" aria-label="AI assistant">
    <div id="chat-head">
      <h2>Ask AI</h2>
      <button id="chat-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="chat-log" aria-live="polite"></div>
    <div id="chat-chips">
      <button type="button">What is in progress?</button>
      <button type="button">Add a task to draft the rollout plan</button>
    </div>
    <form id="chat-form">
      <input id="chat-input" placeholder="Ask the assistant…" maxlength="1000" autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </aside>
  <p id="error" role="alert" hidden></p>
</body>
</html>
